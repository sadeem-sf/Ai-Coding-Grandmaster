<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Science Lab</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
    <div class="jumbotron jumbotron-fluid ">
        <div class="container">
            <h1 class="text-danger font-weight-bold">My Science Lab</h1>
            <p class="lead">Welcome to the lab! Here are some experiments running, discoveries made and research progress.</p>
            <button class="btn btn-primary">Chemistry</button>
            <button class="btn btn-success">Biology</button>
            <button class="btn btn-warning">Physics</button>
            <button class="btn btn-danger">Astronomy</button>
        </div>
    </div>
    <div class="bg-light">
        <div class="container">
            <h2 class="text-danger">Experiments Completed <span class="badge badge-danger">4</span></h2>   
            <p>Chemistry <span class="badge badge-primary">7</span></p>    
            <p>Biology <span class="badge badge-success">5</span></p> 
            <p>Physics <span class="badge badge-warning">3</span></p> 
            <p>Astronomy <span class="badge badge-info">4</span></p> 
            
            <h3 class="text-danger">Research Progress</h3>
            <p class="font-weight-bold">Chemistry</p>
            <div class="progress">
                <div class="Progress-bar bg-primary" style="width: 85%;"></div>
            </div>
            <p class="font-weight-bold">Biology</p>
            <div class="progress">
                <div class="progress-bar bg-success" style="width: 60%;"></div>
            </div>
            <p class="font-weight-bold">Physics</p>
            <div class="progress">
                <div class="Progress-bar bg-warning" style="width: 55%;"></div>
            </div>
            <p class="font-weight-bold">Astronomy</p>
            <div class="progress">
                <div class="Progress-bar bg-info" style="width: 30%;"></div>
            </div>
        </div>
    </div>
</body>
</html>
