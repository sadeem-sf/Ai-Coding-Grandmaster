<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planet Explorer</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body class="bg-light ">        
    <nav class="navbar navbar-expand-sm navbar-dark bg-info justify-content-center">
        <h1 class="navbar-brand">Planet Explorer</h1>
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Planets</a></li>
        </ul>
    </nav>
    <div class="container">
        <h1 class="text-info">Scanning Galaxy....</h1>
        <div class="spinner-border text-danger"></div>
        <div class="spinner-border text-warning"></div>
        <div class="spinner-border text-success"></div>
         <h2 class="text-info">Featured Planets</h2>
    <div class="row">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-success">Earth</h3>
                <p class="card-text">Our home planet with a ton of life.</p>
                <a href="#" class="btn btn-success">Explore</a>
            </div>
        </div>
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-danger">Mars</h3>
                <p class="card-text">The redplanet.No life exists here.</p>
                <a href="#" class="btn btn-danger">Explore</a>
            </div>
        </div>
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-warning">Saturn</h3>
                <p class="card-text">The planet with the most moons and rings.</p>
                <a href="#" class="btn btn-warning">Explore</a>
            </div>
        </div>
    </div>
    </div>
