<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <title>Bootstrap Containers</title>
</head>
<body>
    <div class=" container-fluid bg-info text-white p-5">
        <h1>Full-Width Container (.container-fluid)</h1>
    </div>
    <div class="container bg-dark text-white my-5 p-5 ">
        <h2>Fixed-Width Container (.container)</h2>
        <p>This box centers itself and changes size at specidfic widths.</p>
    </div>
</body>
</html>
