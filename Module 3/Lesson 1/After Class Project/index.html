<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Clubs</title>
      <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
      <style>
        .card:hover:hover{
            transform: scale(1.02);
            box-shadow: 0 2px 6px ;
        }
      </style>
</head>
<body class="bg-light">
    <h1 class="text-center  mb-5">🏫SCHOOL CLUBS</h1>
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4 mb-4">
                <div class="card text-center h-100 border-info">
                    <div class="card-body">
                        <h3 class="card-title text-primary">💻Coding Club</h3>
                        <p class="card-text">Learn HTML, CSS and JavaScript by building exciting projects.</p>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4 mb-4">
                <div class="card text-center h-100 border-success">
                    <div class="card-body">
                        <h3 class="card-title text-success">🔬 Science Club</h3>
                        <p class="card-text">Perform fun experiments and explore the amazing world of science.</p>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4 mb-4">
                <div class="card text-center h-100 border-warning">
                    <div class="card-body">
                        <h3 class="card-title text-warning">🎨 Art Club </h3>
                        <p class="card-text">Express your creativity through drawing, painting and crafts.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
