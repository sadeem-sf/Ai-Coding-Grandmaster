<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hobby Card</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body class="bg-light py-5">
    <h1 class="text-center text-success">My Hobby Cards</h1>
    <div class="conatiner">
        <div class="row">
            <div class="col-12 cl-md-6 col-lg-4 mb-3">
                <div class="card text-center h-100 border-danger">
                    <div class="card-body">
                        <h3 class="card-title text-danger">Drawing</h3>
                        <p class="card-text">I love sketching comic characters</p>
                    </div>
                </div>
            </div>
            <div class="col-12 cl-md-6 col-lg-4 mb-3">
                <div class="card text-center h-100 border-info">
                    <div class="card-body">
                        <h3 class="card-title text-info">Drawing</h3>
                        <p class="card-text">I play footbal every evening.</p>
                    </div>
                </div>
            </div>
            <div class="col-12 cl-md-6 col-lg-4 mb-3">
                <div class="card text-center h-100 border-secondary">
                    <div class="card-body">
                        <h3 class="card-title text-secondary">Drawing</h3>
                        <p class="card-text">MY favourite books are detective one</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
