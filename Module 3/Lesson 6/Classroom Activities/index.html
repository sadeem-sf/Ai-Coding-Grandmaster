<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safari</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            position: relative;
        }

        .carousel-item {
            height: 100px;
            text-align: center;
            padding-top: 35px;
            font-size: 1.5rem;
            color: white;
        }
    </style>
</head>
<body>
    <div id="democarousel" class="carousel slide" data-ride="carousel">
        <ol class="carousel-indicators">
            <li data-target="#democarousel" data-slide-to="0" class="active"></li>
            <li data-target="#democarousel" data-slide-to="1"></li>
            <li data-target="#democarousel" data-slide-to="2"></li>
        </ol>
        <div class="carousel-inner">
            <div class="carousel-item active bg-success">🌿Forest🍃</div>
            <div class="carousel-item  bg-primary">🌊Ocean</div>
            <div class="carousel-item  bg-warning">🏜️ Desert</div>
        </div>
    </div>
    <a class="carousel-control-prev" href="#democarousel" data-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </a>
    <a class="carousel-control-next" href="#democarousel" data-slide="prev">
        <span class="carousel-control-next-icon"></span>
    </a>
    </div>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>

</html>
