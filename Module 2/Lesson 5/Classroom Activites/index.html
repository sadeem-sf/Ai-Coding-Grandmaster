<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Animal Fact File</title>
    <style>
        body{
            background-image: linear-gradient(to right,navy, pink);
        }
        .animal-fact {
            background-color:#f0f8ff;
            width: 250px;
            height: 250px;
            padding: 50px;
            border: 10px solid #151556;
            margin: 25px;
            padding-bottom: 70px;
        }
    </style>
</head>
<body>
    <center>
    <div class="animal-fact">
        <h1>Snow Leopard</h1>
        <p>Type : Big Cat</p>
        <p>Habitat : Mountainous regions of Central Asia</p>
        <p>Diet : Deer, sheep, and other mountain ungulates</p>
        <p>Cool Fact : Snow leopards are excellent climbers and can leap up to 50 feet horizontally.</p>
    </div>
   </center>
</body>
</html>
