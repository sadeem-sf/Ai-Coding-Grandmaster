<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography</title>
    <style>
        body{
            background-image: radial-gradient(purple,lightblue,pink);
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
        }
        .headers{
            text-transform: uppercase;
        }
        #tagline{
            font-style: italic;
        }
        #power{
            font-weight: bold;
        }
        .weakness{
            text-decoration: line-through;
        }
        .batch{
            transform: rotate(9.5deg);
        }
        .circle{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            animation: colorChange 5s infinite;
        }
        @keyframes colorChange{
        0%{
            background-color: purple;
        } 
        25%{
            background-color: lightblue;
        }
        75%{
            background-color: navy;
        }
        }
    </style>
</head>
<body>
    <h1 class="headers">Thunder Kid</h1>
    <p id="tagline">The Most Powerful Kid</p>
    <h2 class="headers">Power</h2>
    <p id="power">Super Speed</p>
    <h3 class="headers">Weakness</h3>
    <p class="weakness">Broccoli</p>
    <p class="batch">Top Hero</p>
   <center><div class="circle"></div></center> 
</body>
</html>
