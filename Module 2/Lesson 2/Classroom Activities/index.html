<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background effects</title>
    <style> 
    *{
        background-color: lightblue;
    }
    .heading {
        color: navy;
    } 
    p{
        color: white;
        background-color:pink;
    } 
    #special {
        color: rgb(60, 166, 60);
        background-color:lightblue;
    }
    </style>
</head>
<body>
    <h1 class="heading">My Color Card</h1>
    <p id="special">Hi There! This is my very own webpage</p>
    <div>
        <h2 class="heading">About Me</h2>
        <p>My name is Sadeem</p>
        <p>My favorite color is Navy  blue</p>
        <p>My favorite food is Pizza</p>
    </div>

</body>
</html>
