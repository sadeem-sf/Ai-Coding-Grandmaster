<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            background-image: linear-gradient(to right, rgb(0, 41, 128), rgb(255, 137, 107));
        }
        .calculator {
            background-color: white;
            width: 300px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 2px 2px rgba(0, 0, 0, 0.1);
            display: inline-block;
            margin: 50px auto;
        }
        h1{
            color: rgb(0, 41, 128);
            font-family: 'Courier New', Courier, monospace;
        }
        .numbers{
            font-size: 20px;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            background-color: aliceblue;
        }
        .result{
            font-size: 18px;
            color: rgb(0, 41, 128);
            margin: 10px;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>

<body>
    <div class="calculator">
        <h1>Simple Calculator</h1>
        <p>Perform basic arithmetic operations with this simple calculator.</p>
        <div class="numbers">
            <p>Let number 1: 20</p>
            <p>Let number 2: 15</p>
        </div>
        <p id="add" class="result"></p>
        <p id="sub" class="result"></p>
        <p id="mul" class="result"></p>
        <p id="div" class="result"></p>
        <p id="mod" class="result"></p>
    </div>
    <script>
        let num1 = 20;
        let num2 = 15;
        let add = num1 + num2;
        let sub = num1 - num2;
        let mul = num1 * num2;
        let div = num1 / num2;
        let mod = num1 % num2;
        document.getElementById("add").innerHTML = "Addition: " + add;
        document.getElementById("sub").innerHTML = "Subtraction: " + sub;
        document.getElementById("mul").innerHTML = "Multiplication: " + mul;
        document.getElementById("div").innerHTML = "Division: " + div;
        document.getElementById("mod").innerHTML = "Modulus: " + mod;
    </script>
</body>

</html>
