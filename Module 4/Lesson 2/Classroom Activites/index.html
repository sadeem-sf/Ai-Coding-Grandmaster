<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Example</title>
</head>
<body>
    <p id="global"></p>
    <p id="local"></p>
    <p id="after"></p>
    <script>
        let sum = 5;
        document.getElementById("global").innerHTML = "Global:" + sum;
        function addition(num1,num2){
            let sum = num1 + num2;
            document.getElementById("local").innerHTML = "Local:" + sum;
        }
        addition(6,2);
        document.getElementById("after").innerHTML = "Global:" + sum;
    </script>
</body>
</html>
