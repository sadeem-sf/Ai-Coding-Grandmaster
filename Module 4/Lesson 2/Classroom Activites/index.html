<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Example</title>
</head>
<body>
    <p id="abc"></p>
    <script>
        function addition(num1,num2){
            return num1 + num2;
        }
        document.getElementById("abc").innerHTML = addition(7,2);
    </script>
</body>
</html>
