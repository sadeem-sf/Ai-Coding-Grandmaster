<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Analyzer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            text-align: center;
            margin: 0;
            padding: 40px;
            background-repeat: no-repeat;
        }

        .container {
            background-color: white;
            max-width: 650px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #4b3f9e;
        }

        label {
            font-weight: bold;
            display: inline-block;
            margin-bottom: 8px;
        }

        input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 10px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 30px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4b3f9e;
        }

        #result {
            margin-top: 20px;
            padding: 20px;
            background-color: #f4f5ff;
            border-radius: 12px;
            text-align: left;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <div>
        <h1>🔢Javascript Analyzer</h1>
        <p>Enter your name and number to analyze them!</p>
        <label>Enter Your Name:</label>
        <input type="text" id="name">
        <br><br>
        <label>Enter Your Number:</label>
        <input type="number" id="number">
        <br><br>
        <button onclick="analyze()">Analyze</button>
        <h2>Results</h2>
        <p id="result"></p>
    </div>
    <script>

        function analyze() {

            var username = document.getElementById("name").value;
            var usernumber = document.getElementById("number").value;

            if (username == "" || usernumber == "") {
                document.getElementById("result").innerHTML =
                    "⚠️ Please enter both your name and number.";
                return;
            }

            var upperName = username.toUpperCase();
            var lowerName = username.toLowerCase();
            var nameLength = username.length;

            var numberType;

            if (usernumber % 2 == 0) {
                numberType = "Even";
            } else {
                numberType = "Odd";
            }

            var table = "";

            for (var i = 1; i <= 10; i++) {
                table += usernumber + "x" + i + "=" + (usernumber * i) + "<br>";
            }

            var numbers = "";

            for (var i = 1; i <= 10; i++) {
                numbers += i + " ";
            }

            var randomNumber = Math.floor(Math.random() * 100);

            var date = new Date();
            var today = date.getDate();
            var month = date.getMonth() + 1;
            var year = date.getFullYear();

            document.getElementById("result").innerHTML =
                "Hello " + username + "!<br><br>" +
                "🔠 Uppercase: " + upperName + "<br>" +
                "🔡 Lowercase: " + lowerName + "<br>" +
                "📏 Name length: " + nameLength + "<br><br>" +
                "🔢 Your number is " + usernumber + "<br>" +
                "📊 Your number is " + numberType + "<br><br>" +
                "📋 Multiplication Table:<br>" + table + "<br>" +
                "🔢 Numbers from 1 to 10:<br>" + numbers + "<br><br>" +
                "🎲 Random number: " + randomNumber + "<br><br>" +
                "📅 Today's Date: " + today + "/" + month + "/" + year;

        }

    </script>
</body>
</html>
