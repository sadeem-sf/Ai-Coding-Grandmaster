<!DOCTYPE html>
<html>
<head>
  <title>My Superhero Power Cards</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eef2ff;
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: #5b21b6;
      font-size: 36px;
    }

    p {
      color: #444444;
    }

    .intro {
      font-size: 17px;
      margin-bottom: 20px;
    }

    button {
      background-color: #5b21b6;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #43158a;
    }

    .card-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .hero-card {
      background-color: white;
      border: 3px solid #5b21b6;
      border-radius: 15px;
      width: 230px;
      padding: 20px;
      box-shadow: 0 5px 12px #c7c7c7;
    }

    .hero-icon {
      font-size: 45px;
    }

    .hero-name {
      font-size: 22px;
      font-weight: bold;
      color: #222222;
    }

    .hero-power {
      color: #2563eb;
      font-weight: bold;
    }

    .hero-mission {
      color: #666666;
      font-size: 14px;
    }

    .hero-level {
      color: #7c3aed;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h1>⚡ Superhero Power Cards ⚡</h1>
  <p class="intro">Meet the heroes who protect the digital world! Click the button to reveal their powers, missions and hero levels.</p>
  <button onclick="showHeroes()">Reveal the Heroes</button>
  <div class="card-container" id="heroCards"></div>
  <script>
    class Superhero {
      constructor(name, power, mission, level, icon) {
        this.name = name;
        this.power = power;
        this.mission = mission;
        this.level = level;
        this.icon = icon;
      }

      describeHero() {
        return "<div class='hero-card'>" +
               "<div class='hero-icon'>" + this.icon + "</div>" +
               "<p class='hero-name'>" + this.name + "</p>" +
               "<p class='hero-power'>⚡ Power: " + this.power + "</p>" +
               "<p class='hero-mission'>🎯 Mission: " + this.mission + "</p>" +
               "<p class='hero-level'>🏆 Hero Level: " + this.level + "</p>" +
               "</div>";
      }
    }

    function showHeroes() {

      let hero1 = new Superhero(
        "Captain Code",
        "Debugging errors",
        "Find bugs before they destroy a program.",
        "Master Coder",
        "💻"
      );

      let hero2 = new Superhero(
        "Pixel Flash",
        "Super-speed design",
        "Create awesome websites before anyone can blink.",
        "Design Hero",
        "⚡"
      );

      let hero3 = new Superhero(
        "Logic Girl",
        "Extreme problem-solving",
        "Turn confusing problems into simple solutions.",
        "Brain Power",
        "🧠"
      );

      let hero4 = new Superhero(
        "Data Knight",
        "Data protection",
        "Protect important information from digital villains.",
        "Cyber Guardian",
        "🛡️"
      );

      document.getElementById("heroCards").innerHTML =
        hero1.describeHero() +
        hero2.describeHero() +
        hero3.describeHero() +
        hero4.describeHero();
    }
  </script>
</body>
</html>
