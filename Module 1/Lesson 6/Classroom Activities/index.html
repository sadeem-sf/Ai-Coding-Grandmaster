<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms In HTML</title>
</head>
<body>
    <form>
        <fieldset>
            <legend><b>Profile & Grades</b></legend>
            <input type="text" id="name" placeholder="Enter Your Name"><br><br>
            <input type="password" id="password" placeholder="Enter Your Password"><br><br>
            <input type="date" id="date" placeholder="Enter Your Date of Birth"><br><br>
            <label>Gender</label><br>
            <input type="radio" name="gender" value="M">M<br>
            <input type="radio" name="gender" value="F">F<br>
            <label>Cities</label><br>
            <input type="checkbox" >Islammabad<br>
            <input type="checkbox" >Lahore<br>
            <input type="checkbox" >Karachi<br>
            <select>
                <option value="">Math</option>
                <option value="">Science</option>
                <option value="">English</option>
                <option value="">Coding</option>
            </select><br><br>
        <input type="submit">
        </fieldset>
    </form>
</body>
</html>
